<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        body{
            background: #002339;
            color: #fff;
        }
        .container{
            margin: 12%;
            width: 90%;
            max-width: 700px;
        }
        .display{
            width: 100%;
            margin-top: 30px;
            background: #fff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 20px ;
            border-radius: 10px;
        }
        .container h1{
            font-weight: 500;
            font-size: 45px;
        }
        .container  h1 span{
            
            color: #019f55;
            border-bottom: 4px solid #019f55;
            padding-bottom: 7px;

        }
         .display img{
            width: 30px;
            cursor: pointer;
         }
          .display input{
            border: 0;
            outline: 0;
            font-size: 24px;
          }
          .container button img{
            width: 28px;
            margin-right: 10px;


          }
           .container button{
            border: 0;
            outline: 0;
            background: #019f55;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 26px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;

           }




    </style>
</head>
<body>
    <div class="container">
        <h1>Generate a <br><span> Random password</span></h1>
        <div class="display">
            <input type="text" id="password" placeholder="password">
            <img src="/copy.jpg" alt="" onclick="copypassword()">
        </div>
        <button onclick="Createpassword()">  <img src="/wirte.jpg" alt="">Generate password</button>
    </div>



 <script>


    const passwordBox = document.getElementById("password")
    const lenght = 12;
    const upperCase = "SDFGHJKWRETYUGH";
    const lowercase ="dsfkjsdkfsfs"
    const number ="123456789"
    const symbol = "12345!@#$%^&*"
    const allchar = upperCase + lowercase + number + symbol
    function Createpassword(){
        let password ="";
        password += upperCase[Math.floor(Math.random() * upperCase.length)]
        password += lowercase[Math.floor(Math.random() * lowercase.length)]

        password += number[Math.floor(Math.random() * lowercase.length)]
        password += symbol[Math.floor(Math.random() * symbol.length)]
        while(lenght > password.length){
            password += allchar[Math.floor(Math.random() * allchar.length)]
        }
        passwordBox.value = password


        
        
    }
    function copypassword(){
        passwordBox.select()
        document.execCommand("copy")
    }

 </script>

    
</body>
</html>
